[package]
name = "risk-engine"
version = "0.1.0"
edition = "2021"
description = "OLYR risk engine — deterministic, LLM-independent trade validation."

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
